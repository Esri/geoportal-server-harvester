<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Sign in</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    body { font-family: system-ui, sans-serif; background:#f7f7f9; margin:0; }
    .wrap { max-width:520px; margin:8vh auto; background:#fff; border-radius:12px;
            box-shadow:0 8px 24px rgba(0,0,0,.08); padding:2rem; }
    h1 { margin-top:0; font-size:1.25rem; }
    .btn { display:block; width:100%; padding:.75rem 1rem; border:1px solid #ccc; border-radius:8px;
           background:#fff; cursor:pointer; text-align:center; margin:.5rem 0; font-weight:600; }
    .btn.primary { background:#0854c7; color:#fff; border-color:#0854c7; }
    .or { text-align:center; color:#666; margin:1rem 0; }
    .muted { color:#666; font-size:.9rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Sign in to Harvester</h1>

    <button class="btn primary" id="btnArcgis">Sign in with ArcGIS</button>
    <div class="or">— or —</div>
    <button class="btn" id="btnLocal">Sign in with Local Account</button>
    
  </div>

  <script>
    // ======== CONFIGURE THESE ========
    const CLIENT_ID      = 'harvester-ui-client';  // configProperties.getUiClientId()
    const AUTHZ_ENDPOINT = '/geoportal-harvester-war/oauth2/authorize';    // Your SAS authorize endpoint (same origin)
    const REDIRECT_URI   = 'http://localhost:8080/geoportal-harvester-war/callback.html'; // must match RegisteredClient
    const SCOPES         = ['openid','profile','api.read'];                  // adjust as needed

    // ======== PKCE helpers ========
    async function sha256(input) {
      const data = new TextEncoder().encode(input);
      const hash = await crypto.subtle.digest('SHA-256', data);
      return new Uint8Array(hash);
    }
    function b64url(bytes) {
      return btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    }
    function randomStr(len=64) {
      const a = new Uint8Array(len);
      crypto.getRandomValues(a);
      return b64url(a).substring(0, len);
    }
    async function createPkce() {
      const code_verifier  = b64url(crypto.getRandomValues(new Uint8Array(64)));
      const challengeBytes = await sha256(code_verifier);
      const code_challenge = b64url(challengeBytes);
      return { code_verifier, code_challenge };
    }

    async function startAuth({ idpHint } = {}) {
      // 1) Build PKCE + state; persist for callback
      const { code_verifier, code_challenge } = await createPkce();
      const state = randomStr(24);
      sessionStorage.setItem('pkce_code_verifier', code_verifier);
      sessionStorage.setItem('pkce_state', state);

      // 2) Build the authorization request
      const params = new URLSearchParams({
        client_id: CLIENT_ID,
        response_type: 'code',
        redirect_uri: REDIRECT_URI,
        scope: SCOPES.join(' '),
        code_challenge: code_challenge,
        code_challenge_method: 'S256',
        state: state
      });
      if (idpHint) params.set('idp', idpHint); // tell SAS to federate to ArcGIS

      // 3) Top-level redirect (no popup)
      window.location.assign(`${AUTHZ_ENDPOINT}?${params.toString()}`);
    }

    document.getElementById('btnArcgis').addEventListener('click', () => startAuth({ idpHint: 'arcgis' }));
    document.getElementById('btnLocal') .addEventListener('click', () => startAuth({ /* no hint */ }));
  </script>
</body>
</html>
