<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Local Sign in – Geoportal Harvester</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    body { font-family: system-ui, sans-serif; background:#f7f7f9; margin:0; }
    .wrap { max-width:420px; margin:8vh auto; background:#fff; border-radius:12px;
            box-shadow:0 8px 24px rgba(0,0,0,.08); padding:2rem; }
    h1 { margin:0 0 1rem; font-size:1.25rem; }
    label { display:block; font-size:.9rem; color:#333; margin:.5rem 0 .25rem; }
    input { width:100%; padding:.65rem .75rem; border:1px solid #ccc; border-radius:8px; }
    .btn { display:block; width:100%; padding:.75rem 1rem; border-radius:8px; font-weight:600;
           cursor:pointer; margin:.75rem 0; border:1px solid #0854c7; background:#0854c7; color:#fff; }
    .muted { color:#666; font-size:.9rem; }
    .error { color:#b00020; white-space:pre-wrap; display:none; }
  </style>
  <script>
  window.dojoConfig = {
		    locale: "en",
		    async: true,
		    parseOnLoad: true,

		    packages: [		         
		          {
		              name: 'hrv',
		              location: location.pathname.replace(/\/[^/]*$/, '') + '/hrv',
		          }
		    	],
		    baseUrl: window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/'))
		  };
  </script>
  <script src="//ajax.googleapis.com/ajax/libs/dojo/1.10.4/dojo/dojo.js"></script>
</head>
<body>
 <div class="wrap">
    <h1 id="lblTitle">Sign In</h1>

    <form method="post" action="login">
        <label id="lblUsername" for="username">Username:</label>
        <input id="username" name="username" data-dojo-type="dijit/form/TextBox" required>

        <label id="lblPassword" for="password">Password:</label>
        <input id="password" name="password" type="password" data-dojo-type="dijit/form/TextBox" required>

        <button id="btnLogin" class="btn" type="submit">Sign in</button>

        <div id="errorMessage" style="display:none; color:red; font-size:14px">
            Invalid username or password.
        </div>
    </form>
</div> 
  <script>
	  require([		
	    "dojo/i18n!hrv/nls/resources",
	    "dojo/dom",
	    "hrv/security/custom-login",
	    "dojo/domReady!"
	], function (i18n, dom) {
	    dom.byId("lblTitle").innerHTML     = i18n.login.caption;
	    dom.byId("lblUsername").innerHTML  = i18n.login.username;
	    dom.byId("lblPassword").innerHTML  = i18n.login.password;
	    dom.byId("btnLogin").innerHTML     = i18n.login.label;
	});
  </script>
</body>
</html>
