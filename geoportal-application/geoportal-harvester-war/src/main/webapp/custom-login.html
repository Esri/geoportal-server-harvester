<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Local Sign in – Geoportal Harvester</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    body { font-family: system-ui, sans-serif; background:#f7f7f9; margin:0; }
    .wrap { max-width:420px; margin:8vh auto; background:#fff; border-radius:12px;
            box-shadow:0 8px 24px rgba(0,0,0,.08); padding:2rem; }
    h1 { margin:0 0 1rem; font-size:1.25rem; }
    label { display:block; font-size:.9rem; color:#333; margin:.5rem 0 .25rem; }
    input { width:100%; padding:.65rem .75rem; border:1px solid #ccc; border-radius:8px; }
    .btn { display:block; width:100%; padding:.75rem 1rem; border-radius:8px; font-weight:600;
           cursor:pointer; margin:.75rem 0; border:1px solid #0854c7; background:#0854c7; color:#fff; }
    .muted { color:#666; font-size:.9rem; }
    .error { color:#b00020; white-space:pre-wrap; display:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Local Account</h1>

    <!-- IMPORTANT: context-aware action; resolves to /geoportal-harvester-war/login -->
    <form method="post" action="login">
      <!-- If CSRF is enabled later, inject CSRF hidden inputs here -->
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />

      <button class="btn" type="submit">Sign in</button>
      <div id="err" class="error" role="alert"></div>
      
    </form>
  </div>

  <script>
    // ===== CONFIG =====
    function getContextPath() {
      const parts = window.location.pathname.split('/').filter(Boolean);
      return parts.length > 0 ? '/' + parts[0] : ''; // '' when deployed at ROOT
    }		
    const HOME_URL = getContextPath();//'/geoportal-harvester-war';
    const ORIGIN = window.location.origin
    			|| (window.location.protocol + '//' + window.location.host);    
	
    const CLIENT_ID      = 'harvester-ui-client';
    const REDIRECT_URI   = ORIGIN + HOME_URL + '/callback-popup.html';   
    const AUTHZ_ENDPOINT = HOME_URL+'/oauth2/authorize';
    const SCOPES         = ['openid','profile','api.read'];
    

    // PKCE helpers
    async function sha256(input) {
      const data = new TextEncoder().encode(input);
      const hash = await crypto.subtle.digest('SHA-256', data);
      return new Uint8Array(hash);
    }
    function b64url(bytes) {
      return btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    }
    function rnd(len=64) { const a = new Uint8Array(len); crypto.getRandomValues(a); return b64url(a).substring(0,len); }
    async function createPkce() {
      const code_verifier  = b64url(crypto.getRandomValues(new Uint8Array(64)));
      const challengeBytes = await sha256(code_verifier);
      const code_challenge = b64url(challengeBytes);
      return { code_verifier, code_challenge };
    }

    // On Spring login success (server redirects back here with ?loggedin),
    // automatically start /oauth2/authorize
    (async function maybeStartAuthorize() {
      const p = new URLSearchParams(window.location.search);
      if (p.has('loggedin')) {
        const { code_verifier, code_challenge } = await createPkce();
        const state = rnd(24);
        sessionStorage.setItem('pkce_code_verifier', code_verifier);
        sessionStorage.setItem('pkce_state', state);

        const qs = new URLSearchParams({
          client_id: CLIENT_ID,
          response_type: 'code',
          redirect_uri: REDIRECT_URI,
          scope: SCOPES.join(' '),
          code_challenge: code_challenge,
          code_challenge_method: 'S256',
          state: state
        });
        window.location.assign(`${AUTHZ_ENDPOINT}?${qs.toString()}`);
      }
    })();

    // Show Spring error messages (?error)
    (function () {
      const params = new URLSearchParams(window.location.search);
      if (params.has('error')) {
        const err = document.getElementById('err');
        err.textContent = 'Authentication failed. Please check your username and password.';
        err.style.display = 'block';
      }
    })();
  </script>
</body>
</html>
