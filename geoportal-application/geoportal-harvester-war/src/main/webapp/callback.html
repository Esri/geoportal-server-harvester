<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Completing sign‑in…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    body { font-family: system-ui, sans-serif; margin:0; padding:2rem; }
    .muted { color:#666; }
    .error { color:#b00020; white-space:pre-wrap; }
  </style>
</head>
<body>
  <p class="muted">Finalizing sign‑in…</p>
  <pre id="err" class="error" style="display:none"></pre>
<script>
  (async () => {
    const showErr = (t) => { const e = document.getElementById('err'); e.style.display='block'; e.textContent = t; };

    try {
      const params  = new URLSearchParams(window.location.search);
      const code    = params.get('code');
      const state   = params.get('state');
      if (!code) throw new Error('Missing authorization code');

      const expected = sessionStorage.getItem('pkce_state');
      if (expected && state && expected !== state) throw new Error('State mismatch');

      const verifier = sessionStorage.getItem('pkce_code_verifier');
      if (!verifier) throw new Error('Missing PKCE code_verifier');

      const tokenEndpoint = '/geoportal-harvester-war/oauth2/token';
      const clientId      = 'harvester-ui-client';
      const redirectUri   = 'http://localhost:8080/geoportal-harvester-war/callback.html';

      const body = new URLSearchParams({
        grant_type: 'authorization_code',
        client_id: clientId,
        redirect_uri: redirectUri,
        code: code,
        code_verifier: verifier
      });

      const res = await fetch(tokenEndpoint, {
        method: 'POST',
        headers: { 'Content-Type':'application/x-www-form-urlencoded' },
        body: body.toString(),
        credentials: 'include'
      });
      if (!res.ok) throw new Error(`Token error ${res.status}: ${await res.text()}`);
      const tokens = await res.json();

      // Store tokens for your SPA
      sessionStorage.setItem('access_token',  tokens.access_token || '');
      if (tokens.refresh_token) sessionStorage.setItem('refresh_token', tokens.refresh_token);
      if (tokens.id_token)      sessionStorage.setItem('id_token',      tokens.id_token);
      sessionStorage.setItem('token_type',    tokens.token_type || 'Bearer');
      sessionStorage.setItem('expires_in',    String(tokens.expires_in || ''));

      // Clean up PKCE
      sessionStorage.removeItem('pkce_code_verifier');
      sessionStorage.removeItem('pkce_state');

      // Go to app
      window.location.replace('/geoportal-harvester-war');
    } catch (e) {
      showErr(e instanceof Error ? e.message : String(e));
    }
  })();
</script>
</body>
</html>
